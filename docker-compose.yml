version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: timthongtinthuoc-elasticsearch-1
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: timthongtinthuoc-kibana-1
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
volumes:
  es_data: